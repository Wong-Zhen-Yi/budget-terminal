[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist", "release", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"budget_terminal_app/compat.py" = ["F401"]
"budget_terminal_app/dependencies.py" = ["F401"]
